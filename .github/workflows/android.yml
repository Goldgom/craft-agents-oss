name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build and bundle web UI
        run: |
          bun install --frozen-lockfile
          bun run webui:build
          rm -rf apps/android/app/src/main/assets/webui
          mkdir -p apps/android/app/src/main/assets/webui
          cp -R apps/webui/dist/. apps/android/app/src/main/assets/webui/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Build debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PserverUrl=wss://agent.goldgom.top:50003

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: craft-agent-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
