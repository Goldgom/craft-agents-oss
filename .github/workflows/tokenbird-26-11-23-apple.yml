name: TokenBird 26.11.23 Apple build
on:
  push:
    branches: ['codex/tokenbird-26-11-23-apple']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NODE_OPTIONS: '--max-old-space-size=4608'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7843178d33918fc958178cc43e2592d2ab39cc60
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run ios:build:simulator
      - run: bun run ios:build -- --skip-webui
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/ios/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
